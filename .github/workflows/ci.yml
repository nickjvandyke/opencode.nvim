name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Stylua
        run: |
          curl -L https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o stylua.zip
          unzip stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua

      - name: Run Stylua check
        run: stylua --check .

  lua-ls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -L https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz -o /opt/nvim.tar.gz
          mkdir /opt/nvim
          tar xzf /opt/nvim.tar.gz -C /opt/nvim
          mv /opt/nvim/nvim-linux-x86_64/* /opt/nvim
          echo "/opt/nvim/bin" >> $GITHUB_PATH

      - name: Install Lua Language Server
        run: |
          curl -L "https://github.com/LuaLS/lua-language-server/releases/download/3.17.1/lua-language-server-3.17.1-linux-x64.tar.gz" -o /opt/lls.tar.gz
          mkdir /opt/lls
          tar -xzf /opt/lls.tar.gz -C /opt/lls
          echo "/opt/lls/bin" >> $GITHUB_PATH

      - name: Clone snacks.nvim
        run: git clone --depth=1 https://github.com/folke/snacks.nvim /opt/snacks.nvim

      - name: Clone blink.cmp
        run: git clone --depth=1 https://github.com/Saghen/blink.cmp /opt/blink.cmp

      - name: Run Lua LS diagnostics
        run: |
          lua-language-server --configpath .luarc.ci.json --check=.
