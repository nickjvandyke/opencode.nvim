name: opencode-review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action runs headless. Any "ask" rule hangs the job, so every
          # action that could prompt must resolve to allow or deny.
          # The action posts the final response as the PR comment. Deny
          # `gh pr review` so the model cannot post a second one.
          OPENCODE_PERMISSION: |
            {
              "bash": {
                "*": "deny",
                "gh*": "allow",
                "gh pr review*": "deny"
              },
              "external_directory": { "*": "allow" },
              "doom_loop": "deny",
              "question": "deny"
            }
        with:
          model: opencode-go/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Review this pull request:
            - **Code quality**: Spot style, maintainability, and correctness issues
            - **Bugs**: Catch logic errors, edge cases, and incorrect assumptions
            - **Improvements**: Suggest better approaches where applicable
            - **Guidelines**: See CONTRIBUTING.md for project-specific conventions
            - **PR health**: Comment if the PR mixes unrelated changes, lacks a clear "why" in the description, or is unreasonably large for what it achieves.
            - **Contributor check**: For external contributors, verify the PR template is filled out, CI passes, and CONTRIBUTING.md was followed.

            Diffs are important, but make sure you read the entire file to get proper context. Make it clear the suggestions are merely suggestions and the human can decide what to do.

            The action posts your final response as the PR comment. Write the complete review as your final response, and do not post a separate review or comment. Include a suggested fix in a code suggestion block, and name the file and line for each suggestion.

            Review by reading the diff and the surrounding files. You may read external files, including Lua type definitions under `/opt/nvim`, but do not execute `nvim`, `lua-language-server`, `stylua`, or other local tooling. Your only shell command is `gh`.
